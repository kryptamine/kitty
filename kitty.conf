term xterm-256color
shell_integration enabled
allow_hyperlinks yes
editor nvim

# MacOS Settings
macos_quit_when_last_window_closed yes
macos_option_as_alt yes
macos_colorspace displayp3

font_family      MapleMono-NF-Light
bold_font        MapleMono-NF-SemiBold
italic_font      MapleMono-NF-LightItalic
bold_italic_font MapleMono-NF-SemiBoldItalic

font_size 22.0

adjust_line_height   110%

disable_ligatures never
share_connections yes

# window settings
hide_window_decorations yes

# Cursor
cursor_shape block

# default layout is vertical splits only
enabled_layouts Tall, *
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9
map ctrl+0 goto_tab 0

# open new tab with cmd+t
map cmd+t new_tab

# tab styles
tab_bar_min_tabs            1
tab_bar_style               powerline
tab_powerline_style         slanted
tab_bar_edge                top
tab_bar_margin_height       0 0 
tab_bar_align               left
tab_title_max_length        27
tab_title_max_length        30
tab_title_template          " ⌘{index} {title.split('/')[2].rstrip(')')}"
active_tab_title_template   " ⌘{index} {title.split('/')[2].rstrip(')')}"
active_tab_font_style       normal

# Scrollback
allow_remote_control yes
listen_on unix:/tmp/kitty
shell_integration no-cursor no-title

# kitty-scrollback.nvim Kitten alias
action_alias kitty_scrollback_nvim kitten /Users/alexandersatretdinov/.config/kitty/scrollback.py

# Browse scrollback buffer in nvim
map kitty_mod+h kitty_scrollback_nvim
# Browse output of the last shell command in nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output

#theme
include gruber-darker.conf
